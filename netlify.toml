[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Single-page app: send every non-file route to index.html so refreshes on
# /meds, /scam, etc. work. (/api/chat is handled by the function above.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the service worker, so updates reach people right away.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
